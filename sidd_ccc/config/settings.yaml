# ============================================================
# EXAM CHEATING DETECTION — CONFIGURATION
# ============================================================

pipeline:
  sample_fps: 5                    # Frames per second to extract from video
  device: "auto"                   # auto | cpu | cuda:0 | mps

preprocessing:
  resize_width: 1280
  resize_height: 720
  clahe_enabled: true
  clahe_clip_limit: 2.0
  clahe_grid_size: 8

detection:
  model: "yolov8m.pt"              # Auto-downloads on first run
  confidence: 0.5
  iou_threshold: 0.45
  classes: [0]                     # COCO person class
  imgsz: 1280

tracking:
  tracker: "botsort.yaml"          # botsort.yaml | bytetrack.yaml
  track_buffer: 150                # Frames to keep lost tracks
  min_track_length: 25             # Min frames for a valid track

pose:
  backend: "ultralytics"           # ultralytics | mediapipe
  model: "yolov8m-pose.pt"        # YOLOv8 pose model
  keypoint_confidence: 0.2         # Lower threshold for distant/occluded faces

head_pose:
  yaw_looking_threshold: 60        # Degrees — head turned sideways
  sustained_frames: 5              # Consecutive frames to count as "sustained look"

spatial:
  num_rows: 4                      # Fixed number of rows in classroom
  max_columns: 8                   # Max columns per row — extra IDs get force-merged
  neighbor_max_distance: 250       # Pixels — max distance to be neighbors
  seat_merge_distance: 80          # Pixels — merge IDs closer than this into one student
  stale_track_frames: 500          # Prune IDs not seen in this many processed frames (~100s at 5fps)
  # ID stability settings
  position_jump_threshold: 100     # Pixels — flag ID if position jumps > this
  reassignment_interval: 50        # Frames between seat re-validation
  min_stability_score: 0.7         # Reject IDs with stability below this
  pose_iou_threshold: 0.5          # IoU threshold for pose-to-detection matching
  standing_aspect_ratio: 1.4       # Skip students with aspect ratio above this (standing)

features:
  mutual_gaze_dot_threshold: -0.3  # Dot product below this = facing each other
  hand_face_distance: 60           # Pixels — hand near face
  hand_neighbor_distance: 100      # Pixels — hand reaching toward neighbor
  wrist_elevation_threshold: 30    # Pixels above desk level

classifier:
  window_size_seconds: 10          # Sliding window duration
  window_stride_seconds: 2         # Stride between windows
  weights:
    mutual_gaze: 0.25
    headturn_hand_on_face: 0.25
    sustained_head_turn: 0.15
    whispering_posture: 0.10
    body_lean: 0.10
    hand_activity: 0.05
    paper_movement: 0.05
    proximity: 0.05
  # Multi-criteria filter — ALL must pass
  min_suspicious_windows: 2        # Must appear in N+ windows
  min_confidence: 0.85             # Weighted score threshold
  require_mutual: false            # Both students must show behavior

alerts:
  tier_very_high: 0.85
  tier_high: 0.70
  tier_medium: 0.55
  max_evidence_frames: 10
  output_dir: "outputs"
  save_annotated_video: false  # Set to false to skip annotated video
  save_evidence_frames: false  # Set to false to skip evidence photos
  save_report: true
